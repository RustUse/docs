name: Bug report
description: Report a broken page, docs regression, or non-security site issue.
title: 'bug: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not use this template for suspected security issues. Follow the private reporting guidance in `SECURITY.md` instead.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the exact steps needed to reproduce the issue.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Affected URL or path
      placeholder: /guides/... or /api/...
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, device, or local command details.
