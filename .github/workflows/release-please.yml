name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          # If branch protection requires checks on Release Please PRs, replace
          # github.token with a PAT secret such as RELEASE_PLEASE_TOKEN.
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Check out released commit
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Set up Node.js
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Rust
        if: ${{ steps.release.outputs.release_created }}
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci

      - name: Validate and build release artifact
        if: ${{ steps.release.outputs.release_created }}
        run: npm run validate:full

      - name: Archive built site
        if: ${{ steps.release.outputs.release_created }}
        shell: bash
        run: tar -czf "rustuse-docs-${{ steps.release.outputs.tag_name }}.tar.gz" dist

      - name: Configure GitHub Pages
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload release artifact
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload \
            "${{ steps.release.outputs.tag_name }}" \
            "./rustuse-docs-${{ steps.release.outputs.tag_name }}.tar.gz" \
            --clobber

  deploy-pages:
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
