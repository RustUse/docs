name: PR Checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Check out llms.txt sibling workspaces
        run: npm run checkout:llms-workspaces

      - name: Check llms.txt freshness
        run: npm run check:llms:ci

      - name: Validate authored docs and site checks
        run: npm run validate

      - name: Build production artifact
        run: npm run build

      - name: Smoke-test built output
        run: npm run smoke:dist
